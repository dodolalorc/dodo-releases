  <title id="title">Dodo 巧克力甜甜圈</title>
  <desc id="desc">奶油色背景上，手绘圆环形的金黄甜甜圈覆着波浪边巧克力糖霜，点缀四颗奶油色糖针和一颗粉色糖针。</desc>
